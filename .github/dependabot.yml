version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
