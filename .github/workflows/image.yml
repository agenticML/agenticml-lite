name: Server image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - pyproject.toml
      - src/**
      - scripts/server_smoke.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_stable: ${{ steps.version.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/agenticml/__init__.py)
          echo "tag=$tag pyproject=$pyproject __init__=$init"
          test "$tag" = "$pyproject" && test "$tag" = "$init"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install smoke client
        run: |
          python -m venv testbed/.venv
          testbed/.venv/bin/python -m pip install --upgrade pip
          testbed/.venv/bin/python -m pip install -e .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: agenticml-server:smoke
      - name: Smoke test
        env:
          SMOKE_IMAGE: agenticml-server:smoke
        run: bash scripts/server_smoke.sh
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: false

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.smoke.outputs.version }}
          IS_STABLE: ${{ needs.smoke.outputs.is_stable }}
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/agenticml/agenticml-server:$VERSION"
            if [[ "$IS_STABLE" == true ]]; then
              echo 'ghcr.io/agenticml/agenticml-server:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.smoke.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.5
      - name: Sign image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/agenticml/agenticml-server@$DIGEST"
      # Verify a published image (replace <digest> with its sha256:... digest):
      # cosign verify --certificate-identity-regexp '^https://github\.com/agenticML/agenticml-lite/\.github/workflows/image\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/agenticml/agenticml-server@<digest>
      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/agenticML/agenticml-lite/\.github/workflows/image\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/agenticml/agenticml-server@$DIGEST"
