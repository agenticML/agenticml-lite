services:
  server:
    image: ghcr.io/agenticml/agenticml-server:2.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AGENTICML_SERVER_PUBLIC_URL: ${AGENTICML_SERVER_PUBLIC_URL:-}
    # Read the first-admin setup URL with: docker compose logs server
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  data:
