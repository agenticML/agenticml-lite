# nginx in front of `agenticml server serve` on a private network.
# Put this file in /etc/nginx/conf.d/agenticml.conf (it holds an `http`-level
# log_format plus one server block, so it works there as is).
# Then: sudo nginx -t && sudo systemctl reload nginx

# Access log without the request line. The query string carries setup and
# invite tokens, so the log must never contain $request, $request_uri or $args.
# $uri has no query string.
log_format agenticml '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    server_name agenticml.lab.internal;

    # The certificate must cover server_name and be signed by a CA that every
    # client trusts. Keep the key readable by root (and the nginx master) only.
    ssl_certificate     /etc/ssl/lab.crt;
    ssl_certificate_key /etc/ssl/lab.key;

    access_log /var/log/nginx/agenticml.access.log agenticml;

    # Runs, objects and artifacts upload as one request each, up to 4 GiB.
    client_max_body_size 4g;
    # Stream bodies to the server as they arrive; do not spool them to disk.
    proxy_request_buffering off;
    # The server answers 411 to a body without Content-Length. The sync client
    # always sends one, and with request buffering off nginx forwards the body
    # as it came, without re-chunking it.
    proxy_http_version 1.1;
    # The server allows about 30 s plus 2 s per MiB for a body (about 2.3 h at
    # 4 GiB), so keep the proxy timeouts above that.
    proxy_read_timeout 3h;
    proxy_send_timeout 3h;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Keep the client's Host with its port. It must equal the host and
        # port of AGENTICML_SERVER_PUBLIC_URL.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Empty values make nginx drop these headers, so a client cannot
        # send an identity to a server that trusts this proxy.
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Amzn-Oidc-Identity "";
        proxy_set_header Tailscale-User-Login "";
    }
}

# A port-80 redirect to https is fine for browsers:
#
# server {
#     listen 80;
#     server_name agenticml.lab.internal;
#     return 301 https://$host$request_uri;
# }
#
# Sync and login must use the https:// URL, because the client refuses
# redirects.
