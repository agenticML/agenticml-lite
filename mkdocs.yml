site_name: agenticml-lite
site_description: Lean, local-first experiment tracker for AgenticML.
site_url: https://agenticml.github.io/agenticml-lite/
repo_url: https://github.com/agenticML/agenticml-lite
repo_name: agenticML/agenticml-lite
edit_uri: edit/main/docs/

# SDK.md and FORMAT.md are contributor notes; they stay in the repo but are
# not published until they are rewritten for users.
exclude_docs: |
  SDK.md
  FORMAT.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
