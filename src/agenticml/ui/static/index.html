<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>agenticml · Runs</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="breadcrumb">agenticml / runs</a>
      <span id="host" class="topbar-host"></span>
      <a id="nav-workspaces" class="btn btn-ghost btn-sm" href="/workspaces" hidden>Workspaces</a>
      <a id="nav-settings" class="btn btn-ghost btn-sm" href="#/settings" hidden>Settings</a>
      <a id="nav-admin" class="btn btn-ghost btn-sm" href="/admin/" hidden>Admin</a>
      <span id="session" class="topbar-session" hidden>
        <span id="session-label" class="topbar-session-label"></span>
        <button id="account" class="btn btn-ghost btn-sm" type="button" hidden>
          Account
        </button>
        <button id="sign-out" class="btn btn-ghost btn-sm" type="button">
          Sign out
        </button>
      </span>
      <a
        id="nav-github"
        class="btn btn-ghost btn-sm"
        href="https://github.com/agenticML/agenticml-lite"
        target="_blank"
        rel="noopener"
        aria-label="agenticml-lite on GitHub"
      >
        <svg
          class="nav-github-icon"
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
        <span class="nav-github-label">GitHub</span>
      </a>
      <button
        id="theme"
        class="btn btn-ghost btn-sm"
        aria-label="Change color theme"
      >
        Theme: system
      </button>
    </header>
    <main id="app"><p class="muted">Loading runs…</p></main>
    <dialog id="lightbox" aria-label="Run media">
      <button id="close-lightbox" class="btn btn-secondary btn-sm">Close</button>
      <img alt="Expanded run media" />
    </dialog>
    <button
      id="contact"
      class="contact-fab"
      type="button"
      popovertarget="contact-panel"
      aria-haspopup="dialog"
      hidden
    >
      <svg
        class="contact-fab-icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3.5 6.5 8.5 6.5 8.5-6.5" />
      </svg>
      <span id="contact-label" class="contact-fab-label">Contact us</span>
    </button>
    <div
      id="contact-panel"
      class="contact-panel"
      popover
      role="dialog"
      aria-labelledby="contact-title"
    >
      <h2 id="contact-title" class="contact-title">Contact us</h2>
      <p id="contact-note" class="contact-note" hidden></p>
      <div class="contact-actions">
        <a id="contact-mail" class="btn btn-primary" href="mailto:">Write an email</a>
        <button id="contact-copy" class="btn btn-secondary" type="button">Copy address</button>
      </div>
      <p id="contact-address" class="contact-address"></p>
      <div id="contact-status" class="contact-status" role="status"></div>
      <button
        class="btn btn-ghost btn-sm contact-close"
        type="button"
        popovertarget="contact-panel"
        popovertargetaction="hide"
      >
        Close
      </button>
    </div>
  </body>
</html>
