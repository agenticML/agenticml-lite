<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>agenticml · Runs</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="breadcrumb">agenticml / runs</a>
      <button
        id="theme"
        class="btn btn-ghost btn-sm"
        aria-label="Change color theme"
      >
        Theme: system
      </button>
    </header>
    <main id="app"><p role="status" aria-live="polite">Loading runs…</p></main>
    <dialog id="lightbox" aria-label="Run media">
      <button id="close-lightbox" class="btn btn-secondary btn-sm">Close</button>
      <img alt="Expanded run media" />
    </dialog>
  </body>
</html>
